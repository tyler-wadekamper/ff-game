<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e151b" />
    <meta
      name="description"
      content="Draft a fictional football team. Outsmart eleven managers. Play a whole season on your own time."
    />
    <title>Fourth & Forever · Fantasy Season Simulator</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./demo-boot.mjs"></script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to game</a>
    <div id="app">
      <div class="boot">
        <div class="brand-mark">F</div>
        <h1>Fourth & Forever</h1>
        <p>Opening the locker room…</p>
      </div>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
    <dialog id="dialog"></dialog>
    <noscript>This game needs JavaScript to draft and manage your team.</noscript>
  </body>
</html>
