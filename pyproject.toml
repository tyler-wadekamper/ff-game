[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ff-game-data"
version = "0.1.0"
description = "Reproducible NFL data ingestion and empirical fictional-career prototype"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "pandas>=2.2,<3", "scipy>=1.14,<2", "scikit-learn>=1.5,<2", "matplotlib>=3.9,<4"]

[project.scripts]
ff-data = "ffsim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
